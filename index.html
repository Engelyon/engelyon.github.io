<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Central - Sci-Fi</title>
    <style>
        /* =========================================
           RESET E ESTILOS GLOBAIS
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: radial-gradient(#30363d 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* =========================================
           CONTAINER DO MENU
        ========================================= */
        .hub-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }

        .hub-container h1 {
            color: #fff;
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hub-container p {
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* =========================================
           GRID DE BOTÕES
        ========================================= */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 25px 20px;
            border-radius: 8px;
            border: 2px solid;
            background: #0d1117;
            text-decoration: none;
            color: #fff;
            font-weight: 900;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn .icon { font-size: 24px; }

        /* Botões de Módulos (Azul/Verde) */
        .btn-modules { border-color: #3b82f6; color: #3b82f6; }
        .btn-modules:hover { background: #3b82f6; color: #fff; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); transform: translateY(-3px); }

        /* Botões de Inimigos (Vermelho - Desativados por enquanto) */
        .btn-enemies { border-color: #f85149; color: #f85149; opacity: 0.6; }
        .btn-enemies:hover { background: #f85149; color: #fff; opacity: 1; box-shadow: 0 0 15px rgba(248, 81, 73, 0.4); transform: translateY(-3px); }

        .status-badge {
            font-size: 10px;
            background: #21262d;
            padding: 3px 8px;
            border-radius: 12px;
            color: #8b949e;
            margin-top: 5px;
            border: 1px solid #30363d;
        }
        .btn-enemies:hover .status-badge { background: #fff; color: #f85149; border-color: #fff; }
    </style>
</head>
<body>

<div class="hub-container">
    <h1>🛸 Sistema de Navegação</h1>
    <p>Estúdio de Criação e Balanceamento do Jogo</p>

    <div class="btn-grid">
        <!-- BOTÕES DE MÓDULOS -->
        <!-- ATENÇÃO: Ajuste o href de acordo com a pasta onde seus arquivos estão! -->
        <a href="pages/cardmaker.html" class="nav-btn btn-modules">
            <span class="icon">🛠️</span>
            Criar Módulo
        </a>

        <a href="pages/modulos.html" class="nav-btn btn-modules">
            <span class="icon">📂</span>
            Ver Módulos
        </a>

        <!-- BOTÕES DE INIMIGOS (Links vazios com '#') -->
        <a href="#" class="nav-btn btn-enemies">
            <span class="icon">👾</span>
            Criar Inimigo
            <span class="status-badge">Em breve</span>
        </a>

        <a href="#" class="nav-btn btn-enemies">
            <span class="icon">🛸</span>
            Ver Inimigos
            <span class="status-badge">Em breve</span>
        </a>
    </div>
</div>

</body>
</html>
