<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Módulos</title>
    <link rel="stylesheet" href="../css/cardmaker_2.css">
    <script src="../js/cardmaker_2.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<a href="../index.html" class="btn-back">⬅ Voltar</a>

<div class="workspace">
    <div class="hud-panel hud-left">
        <div class="control-group">
            <label>Ato</label>
            <select id="ctrl-ato">
                <option value="1">Ato 1</option>
                <option value="2">Ato 2</option>
                <option value="3">Ato 3</option>
            </select>
        </div>
        <div class="control-group" style="margin-top: 15px;">
            <label>Raridade</label>
            <select id="ctrl-raridade">
                <option value="comum">Comum</option>
                <option value="incomum">Incomum</option>
                <option value="raro">Raro</option>
                <option value="unico">Único</option>
            </select>
        </div>
        <div class="control-group checkbox-group" style="margin-top: 25px;">
            <input type="checkbox" id="ctrl-upgraded">
            <label for="ctrl-upgraded" style="color: #fbbf24; font-size: 13px;">🌟 UPGRADE</label>
        </div>
    </div>

    <div class="card-container">
        <div class="card" id="card-preview">
            <div class="top-bar">
                <div class="badge energy" id="out-box-energia">⚡ <span id="out-energia">1</span></div>

                <div class="weight-display" id="out-box-peso">
                    <span id="peso-icon" title="Controlado no painel direito">🏋️</span>
                    <span id="out-peso">0</span>
                </div>

                <div class="badge badge-arma clickable-icon" id="out-badge-tipo" title="Clique para mudar o tipo">🔴</div>
            </div>

            <div class="art-container" id="out-svg-container"></div>

            <div class="status-row" id="out-status-row">
                <div class="stat-box dmg-box" id="out-box-dano">
                    <div class="dmg-val">💥 <span id="out-dano">2</span></div>
                    <div class="dmg-lbl">DANO</div>
                </div>
                <div class="uses-track" id="out-box-usos">
                    <div class="uses-lbl" id="out-usos-lbl">TIROS</div>
                    <div class="uses-slots" id="out-usos-slots"></div>
                </div>
                <div class="stat-box heat-gen-box" id="out-box-calor">
                    <div class="heat-gen-val">🔥 <span id="out-calor">1</span></div>
                    <div class="heat-gen-lbl">CALOR MÁX.</div>
                </div>
            </div>

            <div class="name-plate editable-text" id="out-nome" contenteditable="true">NOME DA CARTA</div>

            <div class="range-table hide" id="out-tabela">
                <div class="range-grid">
                    <div class="grid-cell"><div class="cell-top">1 hex</div><div class="cell-bot" id="out-hex1">-</div></div>
                    <div class="grid-cell"><div class="cell-top">2 hex</div><div class="cell-bot" id="out-hex2">-</div></div>
                    <div class="grid-cell"><div class="cell-top" id="out-longo-label">3+ hex</div><div class="cell-bot" id="out-longo">-</div></div>
                </div>
            </div>

            <div class="desc-box editable-text hide" id="out-desc" contenteditable="true">Descrição</div>
            <div class="simbolos-box hide" id="out-simbolos"></div>
        </div>
    </div>

    <div class="hud-panel hud-right">
        <div class="control-group">
            <label>💥 Dano</label>
            <div class="hud-controls"><button class="btn-hud" onclick="chgStat('dano', -1)">-</button><span class="hud-val" id="disp-dano">0</span><button class="btn-hud" onclick="chgStat('dano', 1)">+</button></div>
        </div>
        <div class="control-group" style="margin-top: 8px;">
            <label>⚡ Custo de energia</label>
            <div class="hud-controls"><button class="btn-hud" onclick="chgStat('energia', -1)">-</button><span class="hud-val" id="disp-energia">1</span><button class="btn-hud" onclick="chgStat('energia', 1)">+</button></div>
        </div>
        <div class="control-group" style="margin-top: 8px;">
            <label>🔥 Limite de calor</label>
            <div class="hud-controls"><button class="btn-hud" onclick="chgStat('calor', -1)">-</button><span class="hud-val" id="disp-calor">1</span><button class="btn-hud" onclick="chgStat('calor', 1)">+</button></div>
        </div>
        <div class="control-group" style="margin-top: 8px;">
            <label id="ctrl-usos-label">🟦 Tiros por ativação</label>
            <div class="hud-controls"><button class="btn-hud" onclick="chgStat('usos', -1)">-</button><span class="hud-val" id="disp-usos">2</span><button class="btn-hud" onclick="chgStat('usos', 1)">+</button></div>
        </div>
        <div class="control-group" style="margin-top: 8px;">
            <label>⚖️ Peso (+ Haltere / - Pena)</label>
            <div class="hud-controls"><button class="btn-hud" onclick="chgStat('peso', -1)">-</button><span class="hud-val" id="disp-peso">0</span><button class="btn-hud" onclick="chgStat('peso', 1)">+</button></div>
        </div>

        <div id="ctrl-mira-panel" class="hide" style="margin-top: 20px; border-top: 1px solid #30363d; padding-top: 15px;">
            <label style="display: block; margin-bottom: 5px;">🎯 Tabela de Mira</label>

            <div class="hud-controls" style="margin-bottom: 5px;">
                <span style="font-size: 11px; width: 45px; color: #8b949e; font-weight: bold;">1 hex</span>
                <button class="btn-hud" onclick="chgMira('hex1', -1)">-</button><span class="hud-val" id="disp-hex1">X</span><button class="btn-hud" onclick="chgMira('hex1', 1)">+</button>
                <button class="btn-hud btn-x" onclick="setMiraX('hex1')">X</button>
            </div>

            <div class="hud-controls" style="margin-bottom: 5px;">
                <span style="font-size: 11px; width: 45px; color: #8b949e; font-weight: bold;">2 hex</span>
                <button class="btn-hud" onclick="chgMira('hex2', -1)">-</button><span class="hud-val" id="disp-hex2">X</span><button class="btn-hud" onclick="chgMira('hex2', 1)">+</button>
                <button class="btn-hud btn-x" onclick="setMiraX('hex2')">X</button>
            </div>

            <div class="control-group" style="margin-top: 10px;">
                <select id="ctrl-range3" style="margin-bottom: 5px; width: 100%;">
                    <option value="3+ hex">3+ hex</option>
                    <option value="3–5 hex">3–5 hex</option>
                </select>
                <div class="hud-controls">
                    <span style="font-size: 11px; width: 45px; color: #8b949e; font-weight: bold;">Longo</span>
                    <button class="btn-hud" onclick="chgMira('longo', -1)">-</button><span class="hud-val" id="disp-longo">X</span><button class="btn-hud" onclick="chgMira('longo', 1)">+</button>
                    <button class="btn-hud btn-x" onclick="setMiraX('longo')">X</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="hud-bottom">
    <div class="hud-bottom-inner">
        <div class="control-group">
            <label>Modo da Área Inferior</label>
            <select id="ctrl-modo-inf">
                <option value="texto">Texto Descritivo</option>
                <option value="mira">Tabela de Mira</option>
                <option value="simbolos">Símbolos </option>
            </select>
        </div>

        <div id="panel-simbolos" class="simb-list hide">
            <div class="simb-row"><span class="simb-icon">⚡ Energia gerada por turno</span><div class="hud-controls"><button class="btn-hud" onclick="chgSimb('raio', -1)">-</button><span class="hud-val" id="simb-raio">0</span><button class="btn-hud" onclick="chgSimb('raio', 1)">+</button></div></div>
            <div class="simb-row"><span class="simb-icon">🔋 Capacidade da bateria</span><div class="hud-controls"><button class="btn-hud" onclick="chgSimb('pilha', -1)">-</button><span class="hud-val" id="simb-pilha">0</span><button class="btn-hud" onclick="chgSimb('pilha', 1)">+</button></div></div>
            <div class="simb-row"><span class="simb-icon">💖 Casco</span><div class="hud-controls"><button class="btn-hud" onclick="chgSimb('coracao', -1)">-</button><span class="hud-val" id="simb-coracao">0</span><button class="btn-hud" onclick="chgSimb('coracao', 1)">+</button></div></div>
            <div class="simb-row"><span class="simb-icon">🛡️ Escudo</span><div class="hud-controls"><button class="btn-hud" onclick="chgSimb('escudo', -1)">-</button><span class="hud-val" id="simb-escudo">0</span><button class="btn-hud" onclick="chgSimb('escudo', 1)">+</button></div></div>
            <div class="simb-row"><span class="simb-icon">🔼 Pontos de movimento</span><div class="hud-controls"><button class="btn-hud" onclick="chgSimb('seta', -1)">-</button><span class="hud-val" id="simb-seta">0</span><button class="btn-hud" onclick="chgSimb('seta', 1)">+</button></div></div>
        </div>

        <div class="export-controls">
            <label class="checkbox-group print-option" for="ctrl-print-economy">
                <input type="checkbox" id="ctrl-print-economy">
                Impressão econômica (P&B)
            </label>
            <button type="button" id="btn-export-png" class="btn-export">📷 Salvar PNG</button>
        </div>
    </div>
</div>

</body>
</html>
