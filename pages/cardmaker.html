<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Cartas - Sci-Fi</title>
    <style>
        /* =========================================
           UI DO APLICATIVO (O ESTÚDIO)
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; height: 100vh; overflow: hidden; position: relative;}

        /* Indicador Visual do Modo de Edição (Fita de Segurança) */
        .edit-mode-stripes {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                    45deg,
                    rgba(210, 153, 34, 0.1),
                    rgba(210, 153, 34, 0.1) 10px,
                    transparent 10px,
                    transparent 20px
            );
            z-index: 100;
            border: 4px solid #d29922;
        }

        .sidebar {
            width: 400px; background: #161b22; border-right: 1px solid #30363d;
            padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; z-index: 2;
        }
        .preview-area {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            background-color: #0d1117; background-image: radial-gradient(#30363d 1px, transparent 1px); background-size: 20px 20px; z-index: 2;
        }

        h2 { color: #fff; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 8px; margin-top: 5px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; font-weight: bold; color: #8b949e; text-transform: uppercase; }

        input, select, textarea {
            background: #0d1117; border: 1px solid #30363d; color: #fff;
            padding: 8px; border-radius: 4px; outline: none; transition: 0.2s; font-size: 13px;
        }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; }

        .row { display: flex; gap: 10px; }
        .row > * { flex: 1; min-width: 0; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; flex-direction: row; cursor: pointer; }

        .edges-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            background: #0d1117;
            padding: 10px;
            border: 1px solid #30363d;
            border-radius: 4px;
        }
        .edge-label { font-size: 11px; color: #c9d1d9; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .edge-label input { cursor: pointer; }

        button {
            color: #fff; border: none; padding: 10px; border-radius: 4px;
            font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 5px;
        }

        .btn-save { background: #238636; }
        .btn-save:hover { background: #2ea043; }

        .btn-load { background: #1f6feb; margin-top: 0; }
        .btn-load:hover { background: #388bfd; }

        .btn-cancel-edit { background: #da3633; display: none; }
        .btn-cancel-edit:hover { background: #f85149; }

        #json-output { height: 90px; font-family: 'Courier New', monospace; font-size: 11px; margin-top: 5px; resize: none; background: #010409; }

        /* =========================================
           CSS DA CARTA
        ========================================= */
        .card {
            width: 225px; height: 340px; background: linear-gradient(135deg, #161b22, #0d1117);
            border: 2px solid #30363d; border-radius: 8px; padding: 10px;
            display: flex; flex-direction: column; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }
        .card.upgraded { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), 0 5px 15px rgba(0,0,0,0.8); }
        .card.upgraded .name-plate { border-color: #fbbf24; color: #fbbf24; }

        .top-bar, .status-row, .name-plate, .range-table, .desc-box { position: relative; z-index: 2; }

        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .badge { background-color: #21262d; border: 2px solid; padding: 4px 8px; font-weight: 900; font-size: 12px; text-align: center; }
        .energy { border-color: #eab308; color: #eab308; border-radius: 4px 4px 8px 8px; }

        .badge-arma { border-color: #ef4444; color: #ef4444; border-radius: 4px 4px 4px 8px; }
        .badge-suporte { border-color: #3b82f6; color: #3b82f6; border-radius: 4px 4px 4px 8px; }
        .badge-propulsao { border-color: #22c55e; color: #22c55e; border-radius: 4px 4px 4px 8px; }

        .art-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; z-index: 1; margin-top: -15px; margin-bottom: -15px; }
        .hex-svg { width: 140px; height: 140px; }
        .art-text { position: absolute; color: #8b949e; text-align: center; font-size: 13px; font-weight: bold; pointer-events: none; z-index: 3; }

        .status-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .stat-box { background: #21262d; border: 2px solid; border-radius: 6px; padding: 6px; text-align: center; width: 58px; }

        .dmg-box { border-color: #f85149; }
        .dmg-val { color: #ff7b72; font-size: 16px; font-weight: 900; }
        .dmg-lbl { color: #f85149; font-size: 9px; font-weight: bold; letter-spacing: 0.5px; }

        .heat-gen-box { border-color: #f97316; }
        .heat-gen-val { color: #fdba74; font-size: 16px; font-weight: 900; }
        .heat-gen-lbl { color: #f97316; font-size: 9px; font-weight: bold; letter-spacing: 0.5px; }

        .uses-track { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 2px; width: 58px; }
        .uses-lbl { color: #38bdf8; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; }
        .uses-slots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;}
        .uses-slot { width: 14px; height: 14px; border: 2px solid #38bdf8; background: #21262d; border-radius: 2px; }

        .name-plate { background: #21262d; border: 2px solid #30363d; color: #fff; text-align: center; padding: 6px; font-size: 12px; font-weight: 900; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }

        .range-table { border: 2px solid #30363d; border-radius: 6px; overflow: hidden; background: #161b22; }
        .range-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
        .grid-cell { padding: 4px 2px; text-align: center; border-right: 2px solid #30363d; }
        .grid-cell:last-child { border-right: none; }
        .cell-top { color: #94a3b8; font-size: 10px; font-weight: bold; margin-bottom: 2px; border-bottom: 1px solid #30363d; padding-bottom: 2px; }
        .cell-bot { font-size: 16px; font-weight: 900; padding-top: 2px; }
        .val-miss { color: #f85149; }
        .val-hit { color: #3fb950; }

        .desc-box { border: 2px solid #30363d; border-radius: 6px; background: #161b22; padding: 10px; color: #94a3b8; font-size: 10px; text-align: center; line-height: 1.4; height: 56px; overflow: hidden;}

        .status-row-utility::before { content: ""; display: block; width: 58px; }
        .hide { display: none !important; }
    </style>
</head>
<body>

<div class="edit-mode-stripes" id="edit-stripes"></div>

<div class="sidebar">
    <button id="btn-load" class="btn-load">📂 Abrir Deck Existente</button>
    <button id="btn-cancel-edit" class="btn-cancel-edit">❌ Cancelar Edição</button>

    <h2 id="form-title">🛠️ Configurador de Módulo</h2>

    <div class="row">
        <div class="form-group">
            <label>Tipo de Carta</label>
            <select id="inp-tipo">
                <option value="arma">Arma (Vermelho)</option>
                <option value="suporte">Suporte (Azul)</option>
                <option value="propulsao">Propulsão (Verde)</option>
            </select>
        </div>
        <div class="form-group checkbox-group" style="padding-top: 20px;">
            <input type="checkbox" id="inp-upgraded">
            <label for="inp-upgraded" style="color: #fbbf24;">UPGRADE</label>
        </div>
    </div>

    <div class="form-group">
        <label>Nome do Módulo</label>
        <input type="text" id="inp-nome" value="Autocanhão">
    </div>

    <div class="form-group">
        <label>Arte (Texto Centro)</label>
        <input type="text" id="inp-arte" value="ARTE DA ARMA">
    </div>

    <div class="row">
        <div class="form-group">
            <label>⚡ Energia</label>
            <input type="number" id="inp-energia" value="1" min="0" max="9">
        </div>
        <div class="form-group">
            <label>🟦 Tiros/Usos</label>
            <input type="number" id="inp-usos" value="2" min="1" max="6">
        </div>
        <div class="form-group">
            <label>🔥 Calor</label>
            <input type="number" id="inp-calor" value="1" min="0" max="9">
        </div>
    </div>

    <div class="form-group">
        <label>Arestas Ativas do Hexágono</label>
        <div class="edges-grid">
            <label class="edge-label"><input type="checkbox" class="inp-edge" value="0" checked> Topo (Plano)</label>
            <label class="edge-label"><input type="checkbox" class="inp-edge" value="1" checked> Sup. Direito</label>
            <label class="edge-label"><input type="checkbox" class="inp-edge" value="5" checked> Sup. Esquerdo</label>
            <label class="edge-label"><input type="checkbox" class="inp-edge" value="2"> Inf. Direito</label>
            <label class="edge-label"><input type="checkbox" class="inp-edge" value="4"> Inf. Esquerdo</label>
            <label class="edge-label"><input type="checkbox" class="inp-edge" value="3"> Base (Plano)</label>
        </div>
    </div>

    <div id="panel-arma">
        <h2 style="margin-top: 10px;">⚔️ Atributos de Combate</h2>
        <div class="form-group">
            <label>💥 Dano</label>
            <input type="number" id="inp-dano" value="2" min="0" max="9">
        </div>
        <div class="row">
            <div class="form-group"><label>Mira: 0 hex</label><input type="text" id="inp-hex0" value="+1"></div>
            <div class="form-group"><label>Mira: 1-2 hex</label><input type="text" id="inp-hex1" value="+1"></div>
            <div class="form-group"><label>Mira: 3+ hex</label><input type="text" id="inp-hex3" value="X"></div>
        </div>
    </div>

    <div id="panel-desc" class="hide">
        <h2 style="margin-top: 10px;">📜 Regras Especiais</h2>
        <div class="form-group">
            <label>Texto da Carta</label>
            <textarea id="inp-desc" rows="3">Gasta 1 uso para realizar uma ação.</textarea>
        </div>
    </div>

    <button id="btn-save" class="btn-save">💾 Adicionar e Salvar no JSON</button>
    <textarea id="json-output" readonly placeholder="Abra um deck ou salve para criar um novo..."></textarea>
</div>

<div class="preview-area">
    <div class="card" id="card-preview">
        <div class="top-bar">
            <div class="badge energy" id="out-energia">⚡ 1</div>
            <div class="badge badge-arma" id="out-badge-tipo">🔴</div>
        </div>

        <div class="art-container" id="out-svg-container"></div>

        <div class="status-row" id="out-status-row">
            <div class="stat-box dmg-box" id="out-box-dano"><div class="dmg-val" id="out-dano">💥 2</div><div class="dmg-lbl">DANO</div></div>
            <div class="uses-track"><div class="uses-lbl" id="out-usos-lbl">TIROS</div><div class="uses-slots" id="out-usos-slots"></div></div>
            <div class="stat-box heat-gen-box"><div class="heat-gen-val" id="out-calor">🔥 1</div><div class="heat-gen-lbl">CALOR</div></div>
        </div>

        <div class="name-plate" id="out-nome">AUTOCANHÃO</div>

        <div class="range-table" id="out-tabela">
            <div class="range-grid">
                <div class="grid-cell"><div class="cell-top">0 hex</div><div class="cell-bot val-hit" id="out-hex0">+ 1</div></div>
                <div class="grid-cell"><div class="cell-top">1-2 hex</div><div class="cell-bot val-hit" id="out-hex1">+ 1</div></div>
                <div class="grid-cell"><div class="cell-top">3+ hex</div><div class="cell-bot val-miss" id="out-hex3">X</div></div>
            </div>
        </div>

        <div class="desc-box hide" id="out-desc"></div>
    </div>
</div>

<script>
    const verticesHex = [
        [27.5, 11], [72.5, 11], [95, 50], [72.5, 89], [27.5, 89], [5, 50]
    ];
    const coresTipo = { arma: '#f85149', suporte: '#60a5fa', propulsao: '#22c55e' };

    let deckJSON = [];
    let fileHandle = null;

    async function abrirArquivoDeck() {
        try {
            [fileHandle] = await window.showOpenFilePicker({
                types: [{ description: 'JSON do Deck', accept: {'application/json': ['.json']} }]
            });

            const file = await fileHandle.getFile();
            const contents = await file.text();

            if(contents.trim() !== '') {
                deckJSON = JSON.parse(contents);
            } else {
                deckJSON = [];
            }

            refreshOutput();
            alert(`✅ Sucesso! O arquivo "${file.name}" foi carregado e está pronto para receber novas cartas.`);
        } catch (err) {
            console.warn("Seleção cancelada ou falha ao abrir:", err);
        }
    }

    async function saveCardToJSON() {
        const nomeAtual = document.getElementById('inp-nome').value.trim();
        const editData = localStorage.getItem('moduloEmEdicao');
        const isEditMode = editData !== null;
        const cartaSendoEditada = isEditMode ? JSON.parse(editData) : null;

        // Validação de nome repetido (ignora se for a própria carta sendo editada)
        const nomeExiste = deckJSON.some(c => c.nome.toLowerCase() === nomeAtual.toLowerCase() && (!isEditMode || c.id !== cartaSendoEditada.id));
        if (nomeExiste) {
            alert(`❌ Erro: Já existe uma carta chamada "${nomeAtual}" no deck!`);
            return;
        }

        const querSalvar = confirm(`Salvar módulo "${nomeAtual}" no arquivo?`);
        if (!querSalvar) return;

        const arestasAtivas = [];
        document.querySelectorAll('.inp-edge').forEach((cb) => {
            if (cb.checked) arestasAtivas.push(parseInt(cb.value));
        });

        const cardData = {
            id: isEditMode ? cartaSendoEditada.id : "MOD_" + Date.now().toString().slice(-6),
            nome: nomeAtual,
            tipo: document.getElementById('inp-tipo').value,
            upgraded: document.getElementById('inp-upgraded').checked,
            energia: parseInt(document.getElementById('inp-energia').value),
            usos: parseInt(document.getElementById('inp-usos').value),
            calor: parseInt(document.getElementById('inp-calor').value),
            arte: document.getElementById('inp-arte').value,
            arestasHex: arestasAtivas
        };

        if (cardData.tipo === 'arma') {
            cardData.dano = parseInt(document.getElementById('inp-dano').value);
            cardData.mira = {
                hex0: document.getElementById('inp-hex0').value,
                hex1_2: document.getElementById('inp-hex1').value,
                hex3: document.getElementById('inp-hex3').value
            };
        } else {
            cardData.descricao = document.getElementById('inp-desc').value;
        }

        // Se for modo edição, tenta carregar o deck base caso esteja vazio,
        // mas a funcionalidade de gravar exige a seleção do arquivo.
        if(isEditMode && deckJSON.length === 0) {
            // Em um ambiente sem servidor, a persistência do fileHandle entre sessões não é garantida.
            // Para atualizar o arquivo correto, o usuário precisará selecionar o arquivo.
            alert("Atenção: Como você está em modo edição, selecione o arquivo JSON do deck para atualizar.");
            try {
                [fileHandle] = await window.showOpenFilePicker({
                    types: [{ description: 'JSON do Deck', accept: {'application/json': ['.json']} }]
                });
                const file = await fileHandle.getFile();
                const contents = await file.text();
                if(contents.trim() !== '') {
                    deckJSON = JSON.parse(contents);
                }
            } catch (err) {
                console.warn("Operação cancelada.", err);
                return;
            }
        }

        if (isEditMode) {
            const index = deckJSON.findIndex(c => c.id === cartaSendoEditada.id);
            if (index > -1) {
                deckJSON[index] = cardData;
            } else {
                deckJSON.push(cardData); // Fallback caso a carta não seja encontrada no deck atual
            }
        } else {
            deckJSON.push(cardData);
        }

        refreshOutput();

        try {
            if (!fileHandle) {
                fileHandle = await window.showSaveFilePicker({
                    suggestedName: 'deck_modulos.json',
                    types: [{ description: 'JSON do Deck', accept: {'application/json': ['.json']} }]
                });
            }

            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(deckJSON, null, 2));
            await writable.close();

            const btn = document.getElementById('btn-save');
            const txtOriginal = btn.innerText;
            btn.innerText = '✅ SALVO NO DISCO!';
            btn.style.background = '#2ea043';
            setTimeout(() => {
                btn.innerText = txtOriginal;
                btn.style.background = '';
                if(isEditMode) {
                    localStorage.removeItem('moduloEmEdicao');
                    window.location.href = 'modulos.html';
                }
            }, 1500);

        } catch (err) {
            console.error("Erro ao gravar o arquivo:", err);
            if(!isEditMode) deckJSON.pop();
            refreshOutput();
        }
    }

    function checarModoEdicao() {
        const editData = localStorage.getItem('moduloEmEdicao');
        if (editData) {
            const carta = JSON.parse(editData);

            document.getElementById('edit-stripes').style.display = 'block';
            document.getElementById('form-title').innerText = `✏️ Editando: ${carta.nome}`;
            document.getElementById('btn-cancel-edit').style.display = 'block';
            document.getElementById('btn-load').style.display = 'none';

            document.getElementById('inp-tipo').value = carta.tipo;
            document.getElementById('inp-upgraded').checked = carta.upgraded;
            document.getElementById('inp-nome').value = carta.nome;
            document.getElementById('inp-arte').value = carta.arte;
            document.getElementById('inp-energia').value = carta.energia;
            document.getElementById('inp-usos').value = carta.usos;
            document.getElementById('inp-calor').value = carta.calor;

            document.querySelectorAll('.inp-edge').forEach(cb => {
                cb.checked = carta.arestasHex.includes(parseInt(cb.value));
            });

            if (carta.tipo === 'arma') {
                document.getElementById('inp-dano').value = carta.dano;
                document.getElementById('inp-hex0').value = carta.mira.hex0;
                document.getElementById('inp-hex1').value = carta.mira.hex1_2;
                document.getElementById('inp-hex3').value = carta.mira.hex3;
            } else {
                document.getElementById('inp-desc').value = carta.descricao;
            }

            const btn = document.getElementById('btn-save');
            btn.innerText = "💾 Atualizar Edição no Arquivo";
            btn.style.background = "#d29922";

            updateCard();
        }
    }

    document.getElementById('btn-cancel-edit').addEventListener('click', () => {
        localStorage.removeItem('moduloEmEdicao');
        window.location.href = 'modulos.html';
    });

    function gerarSvgHexagono(tipo) {
        const corAtiva = coresTipo[tipo] || '#f85149';
        let svgHTML = `<svg class="hex-svg" viewBox="0 0 100 100">`;
        svgHTML += `<polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="#0d1117" stroke="#484f58" stroke-width="2"/>`;

        const checkboxes = document.querySelectorAll('.inp-edge');
        checkboxes.forEach((cb) => {
            if (cb.checked) {
                const idx = parseInt(cb.value);
                const p1 = verticesHex[idx];
                const p2 = verticesHex[(idx + 1) % 6];
                svgHTML += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${corAtiva}" stroke-width="6" stroke-linecap="round"/>`;
            }
        });

        svgHTML += `</svg>`;
        return svgHTML;
    }

    function updateCard() {
        const tipo = document.getElementById('inp-tipo').value;
        const isUpgraded = document.getElementById('inp-upgraded').checked;
        const card = document.getElementById('card-preview');

        isUpgraded ? card.classList.add('upgraded') : card.classList.remove('upgraded');

        document.getElementById('out-nome').innerText = document.getElementById('inp-nome').value;
        document.getElementById('out-energia').innerText = `⚡ ${document.getElementById('inp-energia').value}`;
        document.getElementById('out-calor').innerText = `🔥 ${document.getElementById('inp-calor').value}`;

        const usosNum = parseInt(document.getElementById('inp-usos').value) || 0;
        document.getElementById('out-usos-slots').innerHTML = '<div class="uses-slot"></div>'.repeat(usosNum);

        const badge = document.getElementById('out-badge-tipo');
        const svgContainer = document.getElementById('out-svg-container');
        const statusRow = document.getElementById('out-status-row');
        const txtArte = document.getElementById('inp-arte').value.replace(/\n/g, '<br>');

        const svgPronto = gerarSvgHexagono(tipo);
        svgContainer.innerHTML = svgPronto + `<div class="art-text">${txtArte}</div>`;

        if (tipo === 'arma') {
            document.getElementById('panel-arma').classList.remove('hide');
            document.getElementById('panel-desc').classList.add('hide');

            document.getElementById('out-box-dano').classList.remove('hide');
            document.getElementById('out-tabela').classList.remove('hide');
            document.getElementById('out-desc').classList.add('hide');
            statusRow.classList.remove('status-row-utility');

            badge.className = 'badge badge-arma';
            badge.innerText = '🔴';
            document.getElementById('out-usos-lbl').innerText = 'TIROS';

            document.getElementById('out-dano').innerText = `💥 ${document.getElementById('inp-dano').value}`;

            ['0','1','3'].forEach(hex => {
                const val = document.getElementById(`inp-hex${hex}`).value;
                const el = document.getElementById(`out-hex${hex}`);
                el.innerText = val;
                el.className = (val.includes('X') || val.includes('-')) ? 'cell-bot val-miss' : 'cell-bot val-hit';
            });

        } else {
            document.getElementById('panel-arma').classList.add('hide');
            document.getElementById('panel-desc').classList.remove('hide');

            document.getElementById('out-box-dano').classList.add('hide');
            document.getElementById('out-tabela').classList.add('hide');
            document.getElementById('out-desc').classList.remove('hide');
            statusRow.classList.add('status-row-utility');

            document.getElementById('out-usos-lbl').innerText = 'USOS';
            document.getElementById('out-desc').innerHTML = document.getElementById('inp-desc').value;

            if (tipo === 'suporte') {
                badge.className = 'badge badge-suporte';
                badge.innerText = '🔵';
            } else if (tipo === 'propulsao') {
                badge.className = 'badge badge-propulsao';
                badge.innerText = '🟢';
            }
        }
    }

    function refreshOutput() {
        const output = document.getElementById('json-output');
        output.value = JSON.stringify(deckJSON, null, 2);
        output.scrollTop = output.scrollHeight;
    }

    document.querySelectorAll('.sidebar input, .sidebar select, .sidebar textarea').forEach(input => {
        input.addEventListener('input', updateCard);
        input.addEventListener('change', updateCard);
    });

    document.getElementById('btn-save').addEventListener('click', saveCardToJSON);
    document.getElementById('btn-load').addEventListener('click', abrirArquivoDeck);

    updateCard();
    checarModoEdicao();
</script>
</body>
</html>
