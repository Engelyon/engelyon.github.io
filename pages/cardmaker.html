<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estúdio de Cartas - Sci-Fi</title>
    <link rel="stylesheet" href="../css/cardmaker.css">
    <script src="../js/cardmaker.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="edit-mode-stripes" id="edit-stripes"></div>

<div class="sidebar">
    <a href="../index.html" style="display: inline-block; margin-bottom: 20px; color: #58a6ff; text-decoration: none; font-weight: bold; font-size: 14px;">⬅ Voltar ao Menu</a>

    <button id="btn-load" class="btn-load">📂 Abrir Deck Existente</button>
    <button id="btn-cancel-edit" class="btn-cancel-edit">❌ Cancelar Edição</button>

    <h2 id="form-title">🛠️ Configurador de Módulo</h2>

    <div class="row">
        <div class="form-group">
            <label>Tipo de Carta</label>
            <select id="inp-tipo">
                <option value="arma">Arma (Vermelho)</option>
                <option value="suporte">Suporte (Azul)</option>
                <option value="propulsao">Propulsão (Verde)</option>
            </select>
        </div>
        <div class="form-group checkbox-group" style="padding-top: 20px;">
            <input type="checkbox" id="inp-upgraded">
            <label for="inp-upgraded" style="color: #fbbf24;">UPGRADE</label>
        </div>
    </div>

    <div class="form-group">
        <label>Nome do Módulo</label>
        <input type="text" id="inp-nome" value="NOME">
    </div>

    <div class="form-group">
        <label>Arte (Texto Centro)</label>
        <input type="text" id="inp-arte" value="ARTE DA ARMA">
    </div>

    <div class="row">
        <div class="form-group">
            <label>⚡ Energia</label>
            <input type="number" id="inp-energia" value="1" min="0" max="9">
        </div>
        <div class="form-group">
            <label>🟦 Tiros/Usos</label>
            <input type="number" id="inp-usos" value="2" min="1" max="6">
        </div>
        <div class="form-group">
            <label>🔥 Calor</label>
            <input type="number" id="inp-calor" value="1" min="0" max="9">
        </div>
    </div>

    <div class="form-group">
        <label>Arestas Ativas do Hexágono</label>
        <!-- Novo Grid Visual em Formato de Hexágono -->
        <div class="hex-grid-selector tipo-arma" id="hex-selector-container">
            <div class="hex-row-center"><label class="custom-cb" title="Topo"><input type="checkbox" class="inp-edge" value="0" checked><span class="cb-mark"></span></label></div>
            <div class="hex-row-split">
                <label class="custom-cb" title="Sup. Esquerdo"><input type="checkbox" class="inp-edge" value="5" checked><span class="cb-mark"></span></label>
                <label class="custom-cb" title="Sup. Direito"><input type="checkbox" class="inp-edge" value="1" checked><span class="cb-mark"></span></label>
            </div>
            <div class="hex-row-split">
                <label class="custom-cb" title="Inf. Esquerdo"><input type="checkbox" class="inp-edge" value="4"><span class="cb-mark"></span></label>
                <label class="custom-cb" title="Inf. Direito"><input type="checkbox" class="inp-edge" value="2"><span class="cb-mark"></span></label>
            </div>
            <div class="hex-row-center"><label class="custom-cb" title="Base"><input type="checkbox" class="inp-edge" value="3"><span class="cb-mark"></span></label></div>
        </div>
    </div>

    <div id="panel-arma">
        <h2 style="margin-top: 10px;">⚔️ Atributos de Combate</h2>
        <div class="form-group">
            <label>💥 Dano</label>
            <input type="number" id="inp-dano" value="0" min="0" max="9">
        </div>
        <div class="row">
            <div class="form-group"><label>Mira: 0 hex</label><input type="text" id="inp-hex0" value="-"></div>
            <div class="form-group"><label>Mira: 1-2 hex</label><input type="text" id="inp-hex1" value="-"></div>
            <div class="form-group"><label>Mira: 3+ hex</label><input type="text" id="inp-hex3" value="-"></div>
        </div>
    </div>

    <div id="panel-desc" class="hide">
        <h2 style="margin-top: 10px;">Regras Especiais</h2>
        <div class="form-group">
            <label>Texto da Carta</label>
            <textarea id="inp-desc" rows="3">Blablabla.</textarea>
        </div>
    </div>

    <button id="btn-export-png" type="button" style="background: #8957e5; color: white; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; width: 100%;">
        📷 Exportar Imagem (PNG)
    </button>

    <button id="btn-save" class="btn-save">💾 Adicionar e Salvar no JSON</button>
    <textarea id="json-output" readonly placeholder="Abra um deck ou salve para criar um novo..."></textarea>
</div>

<div class="preview-area">
    <div class="card" id="card-preview">
        <div class="top-bar">
            <div class="badge energy" id="out-energia">⚡ 1</div>
            <div class="badge badge-arma" id="out-badge-tipo">🔴</div>
        </div>

        <div class="art-container" id="out-svg-container"></div>

        <div class="status-row" id="out-status-row">
            <div class="stat-box dmg-box" id="out-box-dano"><div class="dmg-val" id="out-dano">💥 2</div><div class="dmg-lbl">DANO</div></div>
            <div class="uses-track"><div class="uses-lbl" id="out-usos-lbl">TIROS</div><div class="uses-slots" id="out-usos-slots"></div></div>
            <div class="stat-box heat-gen-box"><div class="heat-gen-val" id="out-calor">🔥 1</div><div class="heat-gen-lbl">CALOR</div></div>
        </div>

        <div class="name-plate" id="out-nome">AUTOCANHÃO</div>

        <div class="range-table" id="out-tabela">
            <div class="range-grid">
                <div class="grid-cell"><div class="cell-top">0 hex</div><div class="cell-bot val-hit" id="out-hex0">-</div></div>
                <div class="grid-cell"><div class="cell-top">1-2 hex</div><div class="cell-bot val-hit" id="out-hex1">-</div></div>
                <div class="grid-cell"><div class="cell-top">3+ hex</div><div class="cell-bot val-miss" id="out-hex3">-</div></div>
            </div>
        </div>

        <div class="desc-box hide" id="out-desc"></div>
    </div>
</div>
</body>
</html>
