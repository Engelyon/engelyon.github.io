<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sincronizador de Decks</title>
    <link rel="stylesheet" href="../css/index.css">
    <script src="../js/merge.js"></script>

    <style>
        .merge-container {
            max-width: 600px;
            margin: 50px auto;
            background: #161b22;
            padding: 30px;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            text-align: center;
        }
        .file-box {
            margin: 20px 0;
            padding: 30px;
            border: 2px dashed #484f58;
            border-radius: 6px;
            background: #0d1117;
        }
        #btn-download { display: none; margin-top: 20px; }
        .log-box {
            margin-top: 20px;
            text-align: left;
            background: #0d1117;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>
<a href="../index.html" style="position: absolute; top: 20px; left: 20px; color: #58a6ff; text-decoration: none; font-weight: bold; font-size: 14px;">⬅ Voltar ao Menu</a>
<div class="file-box">
    <label><b>Deck 1:</b></label><br><br>
    <input type="file" id="inp-file-1" accept=".json">
</div>

<div class="file-box">
    <label><b>Deck 2:</b></label><br><br>
    <input type="file" id="inp-file-2" accept=".json">
</div>

<button id="btn-merge" class="btn" style="background: #238636; margin-bottom: 20px;">🧬 Fundir Decks</button>

<div id="log-container" class="log-box"></div>
<button id="btn-download" class="btn">📥 Baixar Deck Final</button>

</body>
</html>
