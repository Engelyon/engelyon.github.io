<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Módulos - Sci-Fi</title>
    <link rel="stylesheet" href="../css/modulos.css">
    <script src="../js/modulos.js" defer></script>
</head>
<body>
<!-- BARRA SUPERIOR -->
<div class="top-nav">
    <div class="nav-title">
        <button id="btn-load-json" class="btn-load">📂 Carregar Deck JSON</button>
        <h1>Galeria de Módulos (<span id="count-display">0</span> cartas)</h1>
    </div>
    <!-- FILTROS -->
    <div class="filters">
        <div class="filter-group">
            <label>Cor (Tipo):</label>
            <select id="filter-tipo">
                <option value="all">Todas</option>
                <option value="arma">Armas (Vermelho)</option>
                <option value="suporte">Suporte (Azul)</option>
                <option value="propulsao">Propulsão (Verde)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Energia:</label>
            <select id="filter-energia">
                <option value="all">Qualquer</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Usos:</label>
            <select id="filter-usos">
                <option value="all">Qualquer</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4+</option>
            </select>
        </div>
    </div>
</div>
<!-- ÁREA DA GALERIA -->
<div class="gallery-container">
    <div class="gallery-grid" id="gallery-grid">
        <!-- As cartas serão injetadas aqui pelo JS -->
    </div>
</div>
<!-- MODAL -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <div class="modal-card-container" id="modal-card-slot"></div>
        <!-- Painel de Ações Laterais -->
        <div class="modal-actions">
            <h3 style="color: #fff; margin-bottom: 10px; font-size: 14px; text-transform: uppercase;">Ações do Módulo</h3>
            <button class="btn-edit" id="btn-modal-edit">✏️ Editar Carta</button>
            <button class="btn-delete" id="btn-modal-delete">🗑️ Deletar Carta</button>
            <button class="btn-close" id="btn-modal-close">✖ Fechar</button>
        </div>
    </div>
</div>
</body>
</html>
