<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Módulos - Sci-Fi</title>
    <style>
        /* =========================================
           UI DA GALERIA
        ========================================= */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; height: 100vh; }

        /* Barra Superior (Controles e Filtros) */
        .top-nav {
            background: #161b22; border-bottom: 1px solid #30363d; padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap;
        }

        .nav-title { display: flex; align-items: center; gap: 15px; }
        .nav-title h1 { color: #fff; font-size: 20px; margin: 0; }

        .filters { display: flex; gap: 15px; align-items: center; background: #0d1117; padding: 10px 20px; border-radius: 8px; border: 1px solid #30363d; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 12px; font-weight: bold; color: #8b949e; text-transform: uppercase; }

        select {
            background: #161b22; border: 1px solid #30363d; color: #fff;
            padding: 6px; border-radius: 4px; outline: none; cursor: pointer;
        }

        button {
            color: #fff; border: none; padding: 10px 15px; border-radius: 4px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-load { background: #1f6feb; }
        .btn-load:hover { background: #388bfd; }

        /* Grade da Galeria */
        .gallery-container {
            flex-grow: 1; padding: 30px; overflow-y: auto;
            background-image: radial-gradient(#30363d 1px, transparent 1px); background-size: 20px 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 225px);
            gap: 30px;
            justify-content: center;
        }

        /* Dica visual para duplo clique */
        .card-wrapper { cursor: pointer; transition: transform 0.2s; }
        .card-wrapper:hover { transform: translateY(-5px); }

        /* =========================================
           MODAL (CARTA EM EVIDÊNCIA)
        ========================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            display: flex; align-items: center; gap: 40px;
        }

        /* Truque para escalar a carta sem quebrar o CSS interno dela */
        .modal-card-container { transform: scale(1.5); margin: 50px; }

        .modal-actions {
            display: flex; flex-direction: column; gap: 15px;
            background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d;
        }
        .btn-edit { background: #d29922; }
        .btn-edit:hover { background: #e3b341; }
        .btn-delete { background: #da3633; }
        .btn-delete:hover { background: #f85149; }
        .btn-close { background: #484f58; margin-top: 20px; }

        /* =========================================
           CSS DA CARTA (REUTILIZADO)
        ========================================= */
        .card { width: 225px; height: 340px; background: linear-gradient(135deg, #161b22, #0d1117); border: 2px solid #30363d; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .card.upgraded { border-color: #fbbf24; box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), 0 5px 15px rgba(0,0,0,0.8); }
        .card.upgraded .name-plate { border-color: #fbbf24; color: #fbbf24; }
        .top-bar, .status-row, .name-plate, .range-table, .desc-box { position: relative; z-index: 2; }
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .badge { background-color: #21262d; border: 2px solid; padding: 4px 8px; font-weight: 900; font-size: 12px; text-align: center; }
        .energy { border-color: #eab308; color: #eab308; border-radius: 4px 4px 8px 8px; }
        .badge-arma { border-color: #ef4444; color: #ef4444; border-radius: 4px 4px 4px 8px; }
        .badge-suporte { border-color: #3b82f6; color: #3b82f6; border-radius: 4px 4px 4px 8px; }
        .badge-propulsao { border-color: #22c55e; color: #22c55e; border-radius: 4px 4px 4px 8px; }
        .art-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; z-index: 1; margin-top: -15px; margin-bottom: -15px; }
        .hex-svg { width: 140px; height: 140px; }
        .art-text { position: absolute; color: #8b949e; text-align: center; font-size: 13px; font-weight: bold; pointer-events: none; z-index: 3; }
        .status-row { display: flex; justify-content: space-between; align-items: flex-end; }
        .stat-box { background: #21262d; border: 2px solid; border-radius: 6px; padding: 6px; text-align: center; width: 58px; }
        .dmg-box { border-color: #f85149; }
        .dmg-val { color: #ff7b72; font-size: 16px; font-weight: 900; }
        .dmg-lbl { color: #f85149; font-size: 9px; font-weight: bold; letter-spacing: 0.5px; }
        .heat-gen-box { border-color: #f97316; }
        .heat-gen-val { color: #fdba74; font-size: 16px; font-weight: 900; }
        .heat-gen-lbl { color: #f97316; font-size: 9px; font-weight: bold; letter-spacing: 0.5px; }
        .uses-track { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 2px; width: 58px; }
        .uses-lbl { color: #38bdf8; font-size: 10px; font-weight: 900; letter-spacing: 0.5px; }
        .uses-slots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center;}
        .uses-slot { width: 14px; height: 14px; border: 2px solid #38bdf8; background: #21262d; border-radius: 2px; }
        .name-plate { background: #21262d; border: 2px solid #30363d; color: #fff; text-align: center; padding: 6px; font-size: 12px; font-weight: 900; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .range-table { border: 2px solid #30363d; border-radius: 6px; overflow: hidden; background: #161b22; }
        .range-grid { display: grid; grid-template-columns: repeat(3, 1fr); }
        .grid-cell { padding: 4px 2px; text-align: center; border-right: 2px solid #30363d; }
        .grid-cell:last-child { border-right: none; }
        .cell-top { color: #94a3b8; font-size: 10px; font-weight: bold; margin-bottom: 2px; border-bottom: 1px solid #30363d; padding-bottom: 2px; }
        .cell-bot { font-size: 16px; font-weight: 900; padding-top: 2px; }
        .val-miss { color: #f85149; }
        .val-hit { color: #3fb950; }
        .desc-box { border: 2px solid #30363d; border-radius: 6px; background: #161b22; padding: 10px; color: #94a3b8; font-size: 10px; text-align: center; line-height: 1.4; height: 56px; overflow: hidden;}
        .status-row-utility::before { content: ""; display: block; width: 58px; }
    </style>
</head>
<body>

<!-- BARRA SUPERIOR -->
<div class="top-nav">
    <div class="nav-title">
        <button id="btn-load-json" class="btn-load">📂 Carregar Deck JSON</button>
        <h1>Galeria de Módulos (<span id="count-display">0</span> cartas)</h1>
    </div>

    <!-- FILTROS -->
    <div class="filters">
        <div class="filter-group">
            <label>Cor (Tipo):</label>
            <select id="filter-tipo">
                <option value="all">Todas</option>
                <option value="arma">Armas (Vermelho)</option>
                <option value="suporte">Suporte (Azul)</option>
                <option value="propulsao">Propulsão (Verde)</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Energia:</label>
            <select id="filter-energia">
                <option value="all">Qualquer</option>
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Usos:</label>
            <select id="filter-usos">
                <option value="all">Qualquer</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4+</option>
            </select>
        </div>
    </div>
</div>

<!-- ÁREA DA GALERIA -->
<div class="gallery-container">
    <div class="gallery-grid" id="gallery-grid">
        <!-- As cartas serão injetadas aqui pelo JS -->
    </div>
</div>

<!-- MODAL (CARTA EM EVIDÊNCIA) -->
<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <!-- A carta grandona vai aqui -->
        <div class="modal-card-container" id="modal-card-slot"></div>

        <!-- Painel de Ações Laterais -->
        <div class="modal-actions">
            <h3 style="color: #fff; margin-bottom: 10px; font-size: 14px; text-transform: uppercase;">Ações do Módulo</h3>
            <button class="btn-edit" id="btn-modal-edit">✏️ Editar Carta</button>
            <button class="btn-delete" id="btn-modal-delete">🗑️ Deletar Carta</button>
            <button class="btn-close" id="btn-modal-close">✖ Fechar</button>
        </div>
    </div>
</div>

<!-- JAVASCRIPT: MOTOR DA GALERIA -->
<script>
    // Configurações Globais
    const verticesHex = [[27.5, 11], [72.5, 11], [95, 50], [72.5, 89], [27.5, 89], [5, 50]];
    const coresTipo = { arma: '#f85149', suporte: '#60a5fa', propulsao: '#22c55e' };

    let deckCompleto = [];
    let currentActiveCardId = null;
    let fileHandle = null; // AQUI ESTÁ A CORREÇÃO: Variável global para manter o arquivo "na mão"

    // 1. CARREGAR JSON
    document.getElementById('btn-load-json').addEventListener('click', async () => {
        try {
            // AQUI ESTÁ A CORREÇÃO: Sem o 'const', ele salva na variável global lá de cima
            [fileHandle] = await window.showOpenFilePicker({
                types: [{ description: 'JSON do Deck', accept: {'application/json': ['.json']} }]
            });
            const file = await fileHandle.getFile();
            const contents = await file.text();

            if (contents.trim() !== '') {
                deckCompleto = JSON.parse(contents);
                renderizarGaleria();
            }
        } catch (err) {
            console.warn("Nenhum arquivo selecionado.");
        }
    });

    // 2. FUNÇÃO QUE DESENHA O SVG DO HEXÁGONO
    function buildSVG(tipo, arestasHex) {
        const corAtiva = coresTipo[tipo] || '#f85149';
        let svg = `<svg class="hex-svg" viewBox="0 0 100 100">`;
        svg += `<polygon points="27.5,11 72.5,11 95,50 72.5,89 27.5,89 5,50" fill="#0d1117" stroke="#484f58" stroke-width="2"/>`;

        arestasHex.forEach(idx => {
            const p1 = verticesHex[idx];
            const p2 = verticesHex[(idx + 1) % 6];
            svg += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${corAtiva}" stroke-width="6" stroke-linecap="round"/>`;
        });
        svg += `</svg>`;
        return svg;
    }

    // 3. FUNÇÃO QUE GERA O HTML DE UMA CARTA ÚNICA
    function gerarHTMLCarta(cardData) {
        const isUpgraded = cardData.upgraded ? 'upgraded' : '';
        const emojis = { arma: '🔴', suporte: '🔵', propulsao: '🟢' };
        const labelUsos = cardData.tipo === 'arma' ? 'TIROS' : 'USOS';
        const slotsUsos = '<div class="uses-slot"></div>'.repeat(cardData.usos);

        let mioloStatus = '';
        if (cardData.tipo === 'arma') {
            const mira = cardData.mira;
            const hitMiss = (val) => (val.includes('X') || val.includes('-')) ? 'val-miss' : 'val-hit';
            mioloStatus = `
                <div class="status-row">
                    <div class="stat-box dmg-box"><div class="dmg-val">💥 ${cardData.dano}</div><div class="dmg-lbl">DANO</div></div>
                    <div class="uses-track"><div class="uses-lbl">TIROS</div><div class="uses-slots">${slotsUsos}</div></div>
                    <div class="stat-box heat-gen-box"><div class="heat-gen-val">🔥 ${cardData.calor}</div><div class="heat-gen-lbl">CALOR</div></div>
                </div>
                <div class="name-plate">${cardData.nome}</div>
                <div class="range-table">
                    <div class="range-grid">
                        <div class="grid-cell"><div class="cell-top">0 hex</div><div class="cell-bot ${hitMiss(mira.hex0)}">${mira.hex0}</div></div>
                        <div class="grid-cell"><div class="cell-top">1-2 hex</div><div class="cell-bot ${hitMiss(mira.hex1_2)}">${mira.hex1_2}</div></div>
                        <div class="grid-cell"><div class="cell-top">3+ hex</div><div class="cell-bot ${hitMiss(mira.hex3)}">${mira.hex3}</div></div>
                    </div>
                </div>
            `;
        } else {
            mioloStatus = `
                <div class="status-row status-row-utility">
                    <div class="uses-track"><div class="uses-lbl">USOS</div><div class="uses-slots">${slotsUsos}</div></div>
                    <div class="stat-box heat-gen-box"><div class="heat-gen-val">🔥 ${cardData.calor}</div><div class="heat-gen-lbl">CALOR</div></div>
                </div>
                <div class="name-plate">${cardData.nome}</div>
                <div class="desc-box">${cardData.descricao}</div>
            `;
        }

        return `
            <div class="card-wrapper" data-id="${cardData.id}" title="Duplo-clique para ampliar">
                <div class="card ${isUpgraded}">
                    <div class="top-bar">
                        <div class="badge energy">⚡ ${cardData.energia}</div>
                        <div class="badge badge-${cardData.tipo}">${emojis[cardData.tipo]}</div>
                    </div>
                    <div class="art-container">
                        ${buildSVG(cardData.tipo, cardData.arestasHex)}
                        <div class="art-text">${cardData.arte.replace(/\n/g, '<br>')}</div>
                    </div>
                    ${mioloStatus}
                </div>
            </div>
        `;
    }

    // 4. RENDERIZAÇÃO E FILTROS
    function renderizarGaleria() {
        const grid = document.getElementById('gallery-grid');
        const fTipo = document.getElementById('filter-tipo').value;
        const fEnergia = document.getElementById('filter-energia').value;
        const fUsos = document.getElementById('filter-usos').value;

        const deckFiltrado = deckCompleto.filter(carta => {
            let passaTipo = (fTipo === 'all' || carta.tipo === fTipo);
            let passaEnergia = (fEnergia === 'all' || carta.energia === parseInt(fEnergia));

            let passaUsos = true;
            if (fUsos !== 'all') {
                if (fUsos === '4') passaUsos = (carta.usos >= 4);
                else passaUsos = (carta.usos === parseInt(fUsos));
            }

            return passaTipo && passaEnergia && passaUsos;
        });

        document.getElementById('count-display').innerText = deckFiltrado.length;

        grid.innerHTML = '';
        deckFiltrado.forEach(carta => {
            grid.innerHTML += gerarHTMLCarta(carta);
        });
    }

    document.getElementById('filter-tipo').addEventListener('change', renderizarGaleria);
    document.getElementById('filter-energia').addEventListener('change', renderizarGaleria);
    document.getElementById('filter-usos').addEventListener('change', renderizarGaleria);

    // 5. LÓGICA DO DUPLO CLIQUE (MODAL)
    const gridContainer = document.getElementById('gallery-grid');
    const modal = document.getElementById('modal');
    const modalSlot = document.getElementById('modal-card-slot');

    gridContainer.addEventListener('dblclick', (e) => {
        const wrapper = e.target.closest('.card-wrapper');
        if (wrapper) {
            currentActiveCardId = wrapper.getAttribute('data-id');
            const cartaSelecionada = deckCompleto.find(c => c.id === currentActiveCardId);

            modalSlot.innerHTML = gerarHTMLCarta(cartaSelecionada);
            modal.classList.add('active');
        }
    });

    // --- 6. AÇÃO: DELETAR CARTA ---
    document.getElementById('btn-modal-delete').addEventListener('click', async () => {
        const carta = deckCompleto.find(c => c.id === currentActiveCardId);

        const confirmacao = confirm(`🚨 ATENÇÃO!\nTem certeza absoluta que deseja deletar o módulo "${carta.nome}"?\nIsso vai apagar a carta direto do seu arquivo JSON.`);

        if (confirmacao) {
            deckCompleto = deckCompleto.filter(c => c.id !== currentActiveCardId);

            if (fileHandle) {
                try {
                    const writable = await fileHandle.createWritable();
                    await writable.write(JSON.stringify(deckCompleto, null, 2));
                    await writable.close();
                    alert(`Módulo "${carta.nome}" apagado com sucesso!`);
                } catch (err) {
                    alert("Erro ao gravar no arquivo. Verifique se ele não está aberto em outro programa.");
                }
            } else {
                alert("Aviso: Como você não carregou um arquivo diretamente do disco nesta sessão, a carta foi apagada apenas da tela.");
            }

            modal.classList.remove('active');
            currentActiveCardId = null;
            renderizarGaleria();
        }
    });
    // --- 7. AÇÃO: EDITAR CARTA ---
    document.getElementById('btn-modal-edit').addEventListener('click', () => {
        // 1. Encontra a carta exata que está aberta no modal
        const carta = deckCompleto.find(c => c.id === currentActiveCardId);

        // 2. Salva os dados dela no localStorage para a outra página poder ler
        localStorage.setItem('moduloEmEdicao', JSON.stringify(carta));

        // 3. Redireciona para o estúdio de criação
        window.location.href = 'cardmaker.html';
    });
    // Fechar Modal
    document.getElementById('btn-modal-close').addEventListener('click', () => {
        modal.classList.remove('active');
        currentActiveCardId = null;
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            modal.classList.remove('active');
        }
    });


</script>
</body>
</html>
