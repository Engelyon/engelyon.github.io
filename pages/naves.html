<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Naves (Cascos)</title>
    <link rel="stylesheet" href="../css/naves.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../js/naves.js" defer></script>
</head>
<body>

<div class="sidebar">
    <a href="../index.html" class="btn-back">⬅ Voltar ao Menu</a>

    <h2>🚀 Engenharia de Casco</h2>
    <p class="help-text">
        Clique nos botões <b>+</b> para expandir a estrutura da nave.<br><br>
        Ative ou desative os indicadores na matriz central para definir quais módulos são aceitos.
    </p>

    <div id="module-legend" class="legend-box"></div>

    <div class="export-controls">
        <label class="print-option" for="ctrl-print-economy">
            <input type="checkbox" id="ctrl-print-economy">
            Impressão econômica (P&B)
        </label>
        <button id="btn-export-png" class="btn-export" type="button">📷 Exportar Casco (PNG)</button>
    </div>
</div>

<div class="workspace" id="workspace">
    <div id="ship-grid" class="ship-grid">
        <svg id="hull-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
</div>

</body>
</html>
